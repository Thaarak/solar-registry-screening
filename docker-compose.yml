services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: solar_acquisition
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d solar_acquisition"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
